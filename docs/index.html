<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet + Drive App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>บันทึกข้อมูล</h1>
      <p class="muted">Frontend: GitHub Pages &middot; Backend: Apps Script &middot; DB: Google Sheets + Drive</p>
    </header>

    <form id="record-form" class="form">
      <label>
        ชื่อ
        <input id="name" type="text" required placeholder="ชื่อรายการ" />
      </label>
      <label>
        รายละเอียด
        <textarea id="note" rows="3" placeholder="รายละเอียดเพิ่มเติม"></textarea>
      </label>
      <label>
        ไฟล์แนบ (เก็บใน Google Drive)
        <input id="file" type="file" />
      </label>
      <button type="submit" id="submit-btn">บันทึก</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section>
      <div class="list-head">
        <h2>รายการล่าสุด</h2>
        <button type="button" id="refresh-btn" class="ghost">รีเฟรช</button>
      </div>
      <ul id="record-list" class="record-list"></ul>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
